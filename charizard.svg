<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Charizard">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FF9A3C" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FF5F1F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF5F1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- pulsing glow -->
  <circle cx="120" cy="130" r="95" fill="url(#fireGlow)">
    <animate attributeName="r" values="90;105;90" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- rising embers -->
  <g fill="#FFB454">
    <circle cx="80" cy="200" r="2.2" opacity="0.8">
      <animate attributeName="cy" values="200;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="205" r="1.8" opacity="0.7">
      <animate attributeName="cy" values="205;50" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="210" r="2.5" opacity="0.9">
      <animate attributeName="cy" values="210;45" dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="3.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="150" r="1.6" opacity="0.6">
      <animate attributeName="cy" values="150;20" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- charizard sprite, gentle float -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="2.2s" repeatCount="indefinite"/>
    <image href="https://img.pokemondb.net/sprites/black-white/anim/normal/charizard.gif" x="40" y="30" width="160" height="160"/>
  </g>
</svg>
